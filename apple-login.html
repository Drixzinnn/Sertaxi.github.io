<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sessão com a Apple</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background: #1c1c1e;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .logo {
            width: 60px;
            margin-bottom: 20px;
            fill: #fff;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 10px 0;
        }
        p {
            font-size: 15px;
            color: #a1a1a6;
            margin-bottom: 30px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 14px 15px;
            font-size: 16px;
            border: 1px solid #3a3a3c;
            border-radius: 8px;
            box-sizing: border-box;
            background: #000;
            color: #fff;
            outline: none;
        }
        input:focus {
            border: 1px solid #0a84ff;
        }
        .btn {
            background-color: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #e5e5ea;
        }
    </style>
</head>
<body>

<div class="container">
    <svg class="logo" viewBox="0 0 384 512">
        <!-- FontAwesome Apple Logo shape -->
        <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
    </svg>
    <h1>ID Apple</h1>
    <p>Iniciar Sessão no SerTaxi com seu ID Apple.</p>

    <div class="form-group">
        <input type="email" id="email" placeholder="E-mail do ID Apple" autofocus required>
    </div>
    <div class="form-group">
        <input type="text" id="name" placeholder="Seu nome" required>
    </div>
    
    <button class="btn" onclick="signIn()">Continuar</button>
</div>

<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
    function signIn() {
        const email = document.getElementById('email').value.trim();
        const name = document.getElementById('name').value.trim();

        if (!email || !name) {
            alert('Por favor, preencha seu e-mail e nome.');
            return;
        }

        // Complete the fake auth flow
        Auth.completeSocialLogin('apple', email, name);
    }
</script>

</body>
</html>
